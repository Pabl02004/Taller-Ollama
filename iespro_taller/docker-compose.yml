version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: iespro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P@blomontero21
      MYSQL_DATABASE: iespro_taller_app
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pP@blomontero21"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-pull-models:
    image: ollama/ollama
    container_name: ollama_pull_models
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "ollama pull llama3.2:3b && ollama pull nomic-embed-text"

  app:
    build: .
    container_name: iespro_app
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: P@blomontero21
      MYSQL_DATABASE: iespro_taller_app
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2:3b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      CHROMA_PATH: /app/db_vectorial
    volumes:
      - .:/app
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  ollama_data: